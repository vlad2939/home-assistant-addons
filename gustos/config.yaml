name: "Gustos"
version: "2.0.0"
slug: "gustos"
description: "Aplicație de rețete culinare"
url: "https://github.com/vlad2939/home-assistant-addons/tree/main/gustos"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Interfața web Gustos"
webui: "http://[HOST]:[PORT:8099]"
# repornire automată dacă aplicația nu mai răspunde (când „Watchdog” este bifat)
watchdog: "http://[HOST]:[PORT:8099]/api/health"
# backup-ul HA oprește add-on-ul câteva secunde, ca baza de date să fie copiată consistent
backup: cold
backup_exclude:
  - "backups/*"
  - "models/*"
